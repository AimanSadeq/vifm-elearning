name: Cron - training followups

# Sends Kirkpatrick L3 (90-day) and L4 (180-day) survey invitations for
# completed training assignments by POSTing the production cron endpoint.
# The route is idempotent (followup_sent_at / impact_sent_at guards), so an
# occasional duplicate run is harmless.
#
# Requires the CRON_SECRET repo secret to match CRON_SECRET on Render.

on:
  schedule:
    - cron: "0 3 * * *" # 06:00 Riyadh, daily
  workflow_dispatch:
    inputs:
      dry:
        description: "Dry run (preview only, nothing sent or written)"
        type: boolean
        default: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/cron/training-followups
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set"
            exit 1
          fi
          URL="https://elearning.viftraining.com/api/cron/training-followups"
          if [ "${{ inputs.dry }}" = "true" ]; then
            URL="$URL?dry=1"
          fi
          HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST -H "x-cron-secret: $CRON_SECRET" "$URL")
          echo "HTTP $HTTP_CODE"
          cat response.json
          [ "$HTTP_CODE" = "200" ]
