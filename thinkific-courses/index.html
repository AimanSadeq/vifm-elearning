<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thinkific Course Explorer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-bottom: 1px solid #334155;
            padding: 24px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #f1f5f9;
        }

        .header h1 span { color: #38bdf8; }

        .stats {
            display: flex;
            gap: 24px;
        }

        .stat-box {
            text-align: center;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 10px 20px;
        }

        .stat-box .num {
            font-size: 22px;
            font-weight: 700;
            color: #38bdf8;
        }

        .stat-box .label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            margin-top: 2px;
        }

        .controls {
            padding: 20px 40px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #38bdf8;
            color: #0f172a;
        }

        .btn-primary:hover { background: #7dd3fc; }

        .btn-secondary {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
        }

        .btn-secondary:hover { background: #334155; }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            max-width: 400px;
            padding: 10px 16px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box:focus { border-color: #38bdf8; }
        .search-box::placeholder { color: #64748b; }

        .progress-bar {
            height: 3px;
            background: #1e293b;
            position: relative;
            overflow: hidden;
        }

        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            transition: width 0.3s;
            width: 0%;
        }

        .loading-status {
            padding: 8px 40px;
            font-size: 13px;
            color: #64748b;
            min-height: 30px;
        }

        .container {
            padding: 0 40px 40px;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
        }

        .course-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.25s;
        }

        .course-card:hover {
            border-color: #475569;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        .course-card-header {
            display: flex;
            gap: 16px;
            padding: 20px;
            cursor: pointer;
        }

        .course-img {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
            background: #334155;
        }

        .course-info { flex: 1; min-width: 0; }

        .course-name {
            font-size: 15px;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .course-meta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .badge {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .badge-chapters {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
        }

        .badge-duration {
            background: rgba(168, 85, 247, 0.15);
            color: #a855f7;
        }

        .badge-id {
            background: rgba(100, 116, 139, 0.2);
            color: #94a3b8;
        }

        .expand-icon {
            color: #64748b;
            font-size: 18px;
            transition: transform 0.2s;
            flex-shrink: 0;
            align-self: center;
        }

        .course-card.expanded .expand-icon {
            transform: rotate(180deg);
        }

        .course-details {
            display: none;
            border-top: 1px solid #334155;
            padding: 0;
        }

        .course-card.expanded .course-details {
            display: block;
        }

        .course-desc {
            padding: 16px 20px;
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.6;
            border-bottom: 1px solid #334155;
        }

        .chapter-item {
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
        }

        .chapter-item:last-child { border-bottom: none; }

        .chapter-header {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .chapter-header:hover { background: rgba(56, 189, 248, 0.05); }

        .chapter-num {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #94a3b8;
            flex-shrink: 0;
        }

        .chapter-name {
            flex: 1;
            font-size: 13px;
            font-weight: 500;
            color: #cbd5e1;
        }

        .chapter-duration {
            font-size: 11px;
            color: #64748b;
        }

        .chapter-expand {
            color: #475569;
            font-size: 14px;
            transition: transform 0.2s;
        }

        .chapter-item.expanded .chapter-expand {
            transform: rotate(180deg);
        }

        .contents-list {
            display: none;
            background: rgba(15, 23, 42, 0.5);
        }

        .chapter-item.expanded .contents-list {
            display: block;
        }

        .content-item {
            padding: 10px 20px 10px 60px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: #94a3b8;
            border-top: 1px solid rgba(51, 65, 85, 0.3);
        }

        .content-type-icon {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            flex-shrink: 0;
            font-weight: 700;
        }

        .type-lesson {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
        }

        .type-quiz {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
        }

        .type-survey {
            background: rgba(168, 85, 247, 0.15);
            color: #a855f7;
        }

        .type-download, .type-pdf {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
        }

        .type-default {
            background: rgba(100, 116, 139, 0.15);
            color: #94a3b8;
        }

        .content-name { flex: 1; }

        .content-free {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            font-weight: 600;
        }

        .loading-chapters {
            padding: 20px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #334155;
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #64748b;
        }

        .empty-state h2 {
            font-size: 18px;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .export-section {
            margin-left: auto;
        }

        @media (max-width: 768px) {
            .header { padding: 16px 20px; flex-direction: column; gap: 16px; }
            .controls { padding: 16px 20px; }
            .container { padding: 0 20px 20px; }
            .course-grid { grid-template-columns: 1fr; }
            .stats { gap: 12px; }
            .content-item { padding-left: 40px; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1><span>Thinkific</span> Course Explorer</h1>
    <div class="stats">
        <div class="stat-box">
            <div class="num" id="totalCourses">-</div>
            <div class="label">Courses</div>
        </div>
        <div class="stat-box">
            <div class="num" id="totalChapters">-</div>
            <div class="label">Chapters</div>
        </div>
        <div class="stat-box">
            <div class="num" id="totalLessons">-</div>
            <div class="label">Lessons</div>
        </div>
    </div>
</div>

<div class="progress-bar"><div class="fill" id="progressFill"></div></div>
<div class="loading-status" id="loadingStatus"></div>

<div class="controls">
    <button class="btn btn-primary" id="loadBtn" onclick="loadAllCourses()">Load All Courses</button>
    <button class="btn btn-secondary" id="expandAllBtn" onclick="expandAll()" disabled>Expand All</button>
    <input type="text" class="search-box" id="searchBox" placeholder="Search courses..." oninput="filterCourses()" disabled>
    <div class="export-section">
        <button class="btn btn-secondary" id="exportBtn" onclick="exportJSON()" disabled>Export JSON</button>
    </div>
</div>

<div class="container">
    <div class="course-grid" id="courseGrid">
        <div class="empty-state">
            <h2>No courses loaded</h2>
            <p>Click "Load All Courses" to fetch your Thinkific courses</p>
        </div>
    </div>
</div>

<script>
const API_BASE = 'https://api.thinkific.com/api/public/v1';
const API_KEY = '80b38f5690243040c0881f029afabbaf';
const SUBDOMAIN = 'guerillaexcel';

const headers = {
    'Content-Type': 'application/json',
    'X-Auth-API-Key': API_KEY,
    'X-Auth-Subdomain': SUBDOMAIN
};

let allCourses = [];
let allExpanded = false;

// --- API CALLS ---

// API 1: GET /courses?page={page}&limit=25
async function fetchCourses(page = 1) {
    const res = await fetch(`${API_BASE}/courses?page=${page}&limit=25`, { headers });
    if (!res.ok) throw new Error(`Failed to fetch courses: ${res.status}`);
    return res.json();
}

// API 2: GET /courses/{courseId}/chapters
async function fetchChapters(courseId) {
    const res = await fetch(`${API_BASE}/courses/${courseId}/chapters`, { headers });
    if (!res.ok) throw new Error(`Failed to fetch chapters for course ${courseId}: ${res.status}`);
    return res.json();
}

// API 3: GET /contents/{contentId}
async function fetchContent(contentId) {
    const res = await fetch(`${API_BASE}/contents/${contentId}`, { headers });
    if (!res.ok) throw new Error(`Failed to fetch content ${contentId}: ${res.status}`);
    return res.json();
}

// --- LOAD ALL COURSES ---

async function loadAllCourses() {
    const loadBtn = document.getElementById('loadBtn');
    loadBtn.disabled = true;
    loadBtn.textContent = 'Loading...';
    allCourses = [];

    try {
        setStatus('Fetching courses page 1...');
        setProgress(5);

        const firstPage = await fetchCourses(1);
        const totalPages = firstPage.meta.pagination.total_pages;
        const totalItems = firstPage.meta.pagination.total_items;

        allCourses = [...firstPage.items];

        for (let page = 2; page <= totalPages; page++) {
            setStatus(`Fetching courses page ${page} of ${totalPages}...`);
            setProgress((page / totalPages) * 30);
            const data = await fetchCourses(page);
            allCourses.push(...data.items);
        }

        setStatus(`Loaded ${allCourses.length} courses. Fetching chapters...`);
        setProgress(30);

        let chaptersLoaded = 0;
        let totalChaptersCount = 0;
        let totalLessonsCount = 0;

        for (let i = 0; i < allCourses.length; i++) {
            const course = allCourses[i];
            setStatus(`Fetching chapters for "${course.name}" (${i + 1}/${allCourses.length})...`);
            setProgress(30 + (i / allCourses.length) * 50);

            try {
                const chapData = await fetchChapters(course.id);
                course._chapters = chapData.items;
                totalChaptersCount += chapData.items.length;

                for (const ch of chapData.items) {
                    totalLessonsCount += ch.content_ids.length;
                }
            } catch (e) {
                course._chapters = [];
            }

            // Small delay to avoid rate limiting
            await sleep(100);
        }

        setProgress(80);
        setStatus('Fetching lesson details...');

        // Fetch content details for all courses
        let contentsFetched = 0;
        let totalContents = allCourses.reduce((sum, c) =>
            sum + (c._chapters || []).reduce((s, ch) => s + ch.content_ids.length, 0), 0);

        for (const course of allCourses) {
            for (const chapter of (course._chapters || [])) {
                chapter._contents = [];
                for (const contentId of chapter.content_ids) {
                    try {
                        const content = await fetchContent(contentId);
                        chapter._contents.push(content);
                    } catch (e) {
                        chapter._contents.push({ id: contentId, name: 'Failed to load', contentable_type: 'Unknown' });
                    }
                    contentsFetched++;
                    if (contentsFetched % 10 === 0) {
                        setStatus(`Fetching lesson details... ${contentsFetched}/${totalContents}`);
                        setProgress(80 + (contentsFetched / totalContents) * 20);
                    }
                    await sleep(50);
                }
            }
        }

        document.getElementById('totalCourses').textContent = allCourses.length;
        document.getElementById('totalChapters').textContent = totalChaptersCount;
        document.getElementById('totalLessons').textContent = totalLessonsCount;

        setProgress(100);
        setStatus(`Done! Loaded ${allCourses.length} courses, ${totalChaptersCount} chapters, ${totalLessonsCount} lessons.`);

        renderCourses(allCourses);

        document.getElementById('expandAllBtn').disabled = false;
        document.getElementById('searchBox').disabled = false;
        document.getElementById('exportBtn').disabled = false;

    } catch (err) {
        setStatus(`Error: ${err.message}`);
    }

    loadBtn.disabled = false;
    loadBtn.textContent = 'Reload Courses';
}

// --- RENDER ---

function renderCourses(courses) {
    const grid = document.getElementById('courseGrid');

    if (courses.length === 0) {
        grid.innerHTML = '<div class="empty-state"><h2>No courses found</h2><p>Try a different search term</p></div>';
        return;
    }

    grid.innerHTML = courses.map((course, idx) => {
        const chapterCount = course.chapter_ids ? course.chapter_ids.length : 0;
        const totalDuration = (course._chapters || []).reduce((s, ch) => s + (ch.duration_in_seconds || 0), 0);
        const durationStr = formatDuration(totalDuration);
        const imgUrl = course.course_card_image_url || '';

        return `
        <div class="course-card" id="course-${course.id}">
            <div class="course-card-header" onclick="toggleCourse(${course.id})">
                ${imgUrl ? `<img class="course-img" src="${imgUrl}" alt="" loading="lazy" onerror="this.style.display='none'">` : ''}
                <div class="course-info">
                    <div class="course-name">${escapeHtml(course.name)}</div>
                    <div class="course-meta">
                        <span class="badge badge-chapters">${chapterCount} chapters</span>
                        ${totalDuration > 0 ? `<span class="badge badge-duration">${durationStr}</span>` : ''}
                        <span class="badge badge-id">ID: ${course.id}</span>
                    </div>
                </div>
                <span class="expand-icon">&#9662;</span>
            </div>
            <div class="course-details">
                ${course.description ? `<div class="course-desc">${escapeHtml(course.description)}</div>` : ''}
                ${renderChapters(course._chapters || [])}
            </div>
        </div>`;
    }).join('');
}

function renderChapters(chapters) {
    if (!chapters.length) return '<div class="loading-chapters">No chapters found</div>';

    return chapters.map((ch, idx) => {
        const durStr = ch.duration_in_seconds > 0 ? formatDuration(ch.duration_in_seconds) : '';
        return `
        <div class="chapter-item" id="chapter-${ch.id}">
            <div class="chapter-header" onclick="toggleChapter(${ch.id})">
                <span class="chapter-num">${idx + 1}</span>
                <span class="chapter-name">${escapeHtml(ch.name)}</span>
                ${durStr ? `<span class="chapter-duration">${durStr}</span>` : ''}
                <span class="chapter-expand">&#9662;</span>
            </div>
            <div class="contents-list">
                ${renderContents(ch._contents || [])}
            </div>
        </div>`;
    }).join('');
}

function renderContents(contents) {
    if (!contents.length) return '<div class="content-item">No content</div>';

    return contents.map(c => {
        const typeInfo = getTypeInfo(c.contentable_type);
        return `
        <div class="content-item">
            <span class="content-type-icon ${typeInfo.cls}">${typeInfo.icon}</span>
            <span class="content-name">${escapeHtml(c.name || 'Untitled')}</span>
            ${c.free ? '<span class="content-free">FREE</span>' : ''}
        </div>`;
    }).join('');
}

// --- INTERACTIONS ---

function toggleCourse(courseId) {
    const el = document.getElementById(`course-${courseId}`);
    el.classList.toggle('expanded');
}

function toggleChapter(chapterId) {
    const el = document.getElementById(`chapter-${chapterId}`);
    el.classList.toggle('expanded');
}

function expandAll() {
    allExpanded = !allExpanded;
    document.querySelectorAll('.course-card').forEach(el => {
        el.classList.toggle('expanded', allExpanded);
    });
    document.querySelectorAll('.chapter-item').forEach(el => {
        el.classList.toggle('expanded', allExpanded);
    });
    document.getElementById('expandAllBtn').textContent = allExpanded ? 'Collapse All' : 'Expand All';
}

function filterCourses() {
    const query = document.getElementById('searchBox').value.toLowerCase().trim();
    if (!query) {
        renderCourses(allCourses);
        return;
    }
    const filtered = allCourses.filter(c =>
        (c.name && c.name.toLowerCase().includes(query)) ||
        (c.description && c.description.toLowerCase().includes(query)) ||
        (c.keywords && c.keywords.toLowerCase().includes(query))
    );
    renderCourses(filtered);
}

function exportJSON() {
    const data = JSON.stringify(allCourses, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'thinkific-courses-export.json';
    a.click();
    URL.revokeObjectURL(url);
}

// --- HELPERS ---

function getTypeInfo(type) {
    const map = {
        'Lesson':      { icon: '&#9654;', cls: 'type-lesson' },
        'Video':       { icon: '&#9654;', cls: 'type-lesson' },
        'Quiz':        { icon: 'Q',       cls: 'type-quiz' },
        'Survey':      { icon: 'S',       cls: 'type-survey' },
        'Download':    { icon: '&#8615;', cls: 'type-download' },
        'Pdf':         { icon: 'P',       cls: 'type-pdf' },
        'Audio':       { icon: '&#9835;', cls: 'type-lesson' },
        'Presentation':{ icon: 'P',       cls: 'type-quiz' },
        'HtmlItem':    { icon: 'H',       cls: 'type-default' },
        'Assignment':  { icon: 'A',       cls: 'type-survey' },
    };
    return map[type] || { icon: '?', cls: 'type-default' };
}

function formatDuration(seconds) {
    if (!seconds) return '';
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    if (h > 0) return `${h}h ${m}m`;
    if (m > 0) return `${m}m ${s}s`;
    return `${s}s`;
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function setProgress(pct) {
    document.getElementById('progressFill').style.width = Math.min(pct, 100) + '%';
}

function setStatus(msg) {
    document.getElementById('loadingStatus').textContent = msg;
}

function sleep(ms) {
    return new Promise(r => setTimeout(r, ms));
}
</script>

</body>
</html>
